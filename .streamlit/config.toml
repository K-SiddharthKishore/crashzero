[theme]
base = "light"
primaryColor = "#1763a6"
backgroundColor = "#f4f7fb"
secondaryBackgroundColor = "#ffffff"
textColor = "#172c43"
font = "sans serif"
[server]
maxUploadSize = 200
[browser]
gatherUsageStats = false

[runner]
# Frequent monitor fragments must not force a full Python heap collection.
# Normal automatic garbage collection remains enabled.
postScriptGC = false
