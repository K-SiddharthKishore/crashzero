[theme]
base = "dark"
primaryColor = "#2563EB"
backgroundColor = "#070D18"
secondaryBackgroundColor = "#111C2E"
textColor = "#F8FAFC"
font = "sans serif"
[server]
maxUploadSize = 200
[browser]
gatherUsageStats = false

[runner]
# Frequent monitor fragments must not force a full Python heap collection.
# Normal automatic garbage collection remains enabled.
postScriptGC = false
