# Keep V1 ByteTrack. Lower second-pass confidence retains weak detections during
# short occlusion; new IDs require stronger evidence than track continuation.
tracker_type: bytetrack
track_high_thresh: 0.25
track_low_thresh: 0.10
new_track_thresh: 0.35
track_buffer: 45
match_thresh: 0.8
fuse_score: True
